name: Auto-marginalia

# Node 20-actions-runtime fjernes 16/9/2026 — tving JS-actions til Node 24 (GitHub-sanktioneret bro).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Søndag 19:00 dansk sommer-tid (CEST, UTC+2) = 17:00 UTC.
# DST-NOTE: Ved CET (vintertid, UTC+1) skal cron ændres til '0 18 * * 0'.

on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kør dry-run (ingen ændringer pushed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          # Hele historikken: vi skal kunne checke en eksisterende PR-branch ud.
          fetch-depth: 0

      # Én åben PR ad gangen. Findes der allerede en, arbejder vi videre på DEN
      # branch — så dedup'en i build-marginalia.mjs kører mod de forslag der
      # allerede ligger og venter, og der kan ikke hobe sig en bunke op.
      # (Før denne ændring åbnede hver søndagskørsel sin egen PR: 11 stk. nåede
      # at samle sig 21/6-30/8 2026, hver med sit eget delvise udsnit.)
      - name: Find eller opret PR-branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto-marginalia/"))]
                  | sort_by(.number) | last | .headRefName // empty')
          if [ -n "$EXISTING" ]; then
            echo "Genbruger åben PR-branch: $EXISTING"
            git checkout "$EXISTING"
            echo "branch=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="auto-marginalia/$(date -u +%Y-%m-%d)"
            echo "Ingen åben PR — ny branch: $BRANCH"
            git checkout -b "$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run auto-marginalia
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/build-marginalia.mjs --dry-run
          else
            node scripts/build-marginalia.mjs
          fi

      - name: Commit + opdatér eller opret PR
        id: commit
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          IS_NEW: ${{ steps.branch.outputs.is_new }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain content/posts/)" ]; then
            echo "Ingen nye forslag — hverken commit eller PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "birkenborg-agents"
          git config user.email "philip+agents@birkenborg.dev"
          git add content/posts/
          git commit -m "auto-marginalia: ugens noter ($DATE)"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$IS_NEW" = "true" ]; then
            gh pr create \
              --title "auto-marginalia: ugens commits → marginalia (åben fra $DATE)" \
              --body "Auto-genereret af build-marginalia.mjs. Denne PR opdateres hver søndag med ugens nye forslag i stedet for at der åbnes en ny. Review hvert forslag og slet de irrelevante FØR merge." \
              --base main \
              --head "$BRANCH"
          else
            echo "Opdaterede eksisterende PR på $BRANCH"
          fi

      # Kun ping når der faktisk kom noget nyt. En uge uden nye forslag er tavs.
      - name: Notify Telegram
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
        run: |
          curl -s -X POST "https://bot.birkenborg.dev/internal/notify" \
            -H "Authorization: Bearer $BOT_INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"text":"Der er kommet nye forslag til margin-noter på bloggen. De ligger samlet ét sted og venter på at du siger god for dem — indtil da er der ikke ændret noget på sitet."}'

      - name: Notify on failure
        if: failure()
        env:
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
        run: |
          curl -s -X POST "https://bot.birkenborg.dev/internal/notify" \
            -H "Authorization: Bearer $BOT_INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"Den ugentlige indsamling af margin-noter til bloggen gik galt i nat. Der er ikke kommet nye forslag ind denne uge, og intet er ændret på sitet. Detaljer: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
