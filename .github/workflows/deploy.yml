name: Deploy to Cloudflare

# Auto-deployer sitet ved push til main.
# Kræver GitHub secrets:
#   CLOUDFLARE_API_TOKEN (Workers Edit + Account Read)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (fejl-alarm — tilføjet 2026-06-07
#   efter 13 dages ubemærket rød CI; botten publicerede uden at noget kom live)
#
# TRUSTED BOUNDARY (hq/decisions/2026-09-26-trusted-boundary.md, samme princip som birkenborg-sites):
# - `build` bygger sitet uden nogen hemmelighed. Kun her kører kode, HQ kan skrive (site/).
# - `deploy` holder CLOUDFLARE_API_TOKEN og kører ingen kode, HQ kan skrive: et betroet sparse træ (worker/, wrangler.toml,
#   rod-manifesterne, scripts/build-corpus.mjs + scripts/linkedin-block.mjs og content/), et assert-trin der fejler hvis
#   andet er på disken, install med --ignore-scripts og en pinnet wrangler. Chat-korpusset — ejerens offentlige stemme,
#   som botten bruger i sin systemprompt — bygger deploy selv fra scripts/ og content/ (hq pin v20, kritik af W1a
#   2026-10-22): det hentes aldrig fra det ubetroede build. Sitets artefakt er data; domænebeviser i det afvises her.
# - `alarm` holder alarm-nøglerne og checker intet ud.
# Enhver ændring her kræver en overvåget gen-godkendelse af grænsen (hq/organisation/trusted-boundary.json).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'worker/**'
      - 'content/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  # Node 20-actions deprecates 2026-06-16 — opt-in til Node 24 nu
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install root dependencies (gray-matter til build-corpus.mjs)
        run: npm ci --ignore-scripts
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site (prebuild bygger korpusset til sitets egne citater; chat-korpusset bygger deploy selv)
        working-directory: site
        run: npm run build
      # Byggets identitet: HQ's live-verifikation læser /hq-build.json og binder den til netop denne kørsel på main.
      - name: Build marker
        run: printf '{"sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > site/dist/hq-build.json
      - name: Refuse edge code in dist
        run: |
          if [ -e site/dist/_worker.js ] || [ -e site/dist/_routes.json ] || [ -d site/dist/functions ]; then echo "edge code in dist: refused"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # TRUSTED_CHECKOUT — do not widen. Only paths HQ cannot write. Any change needs a supervised re-pin.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /wrangler.toml
            /package.json
            /package-lock.json
            /worker/
            /content/
            /scripts/build-corpus.mjs
            /scripts/linkedin-block.mjs
      - name: Assert trusted tree
        run: |
          test ! -e site
          test "$(ls -A scripts | sort | tr '\n' ' ')" = "build-corpus.mjs linkedin-block.mjs "
          test ! -e worker/data/chat-corpus.json
      # wrangler.toml's [build] (til lokal `wrangler deploy`) kører scripts/, som ikke findes i dette træ: deploy bruger en kopi
      # uden. Korpusset er bygget i `build`.
      - name: Deploy config without the build command
        run: |
          awk '/^\[/{skip=($0=="[build]")} !skip' wrangler.toml > wrangler.deploy.toml
          if grep -q -E '^\[build\]|^command' wrangler.deploy.toml; then echo "deploy config still runs a build command"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist/
      - name: Refuse domain proofs in the site artifact
        run: |
          files=$(find site/dist \( -path 'site/dist/.well-known' -o -path 'site/dist/.well-known/*' \) -print -o -regextype posix-extended -iregex '.*/(google[0-9a-f]+\.html|BingSiteAuth\.xml|(app-)?ads\.txt|yandex_[0-9a-f]+\.html|pinterest-[0-9a-f]+\.html)' -print | head -20)
          if [ -n "$files" ]; then echo "domain proof in artifact: refused"; echo "$files"; exit 1; fi
          tags=$(grep -rliE --include='*.htm' --include='*.html' '<meta[^>]*(google-site-verification|msvalidate\.01|p:domain_verify|yandex-verification|facebook-domain-verification|google-adsense-account|seznam-wmt|verify-admitad|fo-verify|(site|domain)[-_]verif)' site/dist | head -20 || true)
          if [ -n "$tags" ]; then echo "verification meta tag in artifact: refused"; echo "$tags"; exit 1; fi
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install worker dependencies (marked, gray-matter)
        run: npm ci --ignore-scripts
      # The owner's public voice for the chat's system prompt, from the trusted tree only (scripts/ and content/, which HQ's
      # hand cannot write), never from the untrusted build's artifact.
      - name: Build the chat corpus from the trusted tree
        run: |
          node scripts/build-corpus.mjs
          test -s worker/data/chat-corpus.json
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.131.1 deploy --config wrangler.deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Går via den erklærede vej, så alarmen bliver logget og sorteret som
  # "risiko". Nødvejen nedenunder er ikke pynt: fejler denne deploy fordi
  # Cloudflare er nede, kan bot.birkenborg.dev være nede af samme grund, og
  # så skal alarmen stadig frem. En tavs fejlet deploy opdages aldrig.
  alarm:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Telegram-alarm ved fejl
        env:
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
        run: |
          PAYLOAD='{"text":"birkenborg.dev kunne ikke opdateres — sitet viser stadig den gamle udgave. Sig til, så finder jeg fejlen.","level":"risiko","source":"birkenborg.dev","what":"birkenborg.dev kunne ikke opdateres — sitet viser stadig den gamle udgave, og det du senest har ændret er ikke gået i luften.","action":"Sig til, så finder jeg fejlen og sender det live igen."}'
          if curl -fsS -X POST "https://bot.birkenborg.dev/internal/notify" \
               -H "Authorization: Bearer $BOT_INTERNAL_TOKEN" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" > /dev/null; then
            exit 0
          fi
          echo "Erklæret vej svarede ikke — bruger nødvejen direkte til Telegram."
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="birkenborg.dev kunne ikke opdateres — sitet viser stadig den gamle udgave. Sig til, så finder jeg fejlen." > /dev/null
