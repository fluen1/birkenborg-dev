name: Deploy to Cloudflare

# Auto-deployer sitet ved push til main.
# Kræver GitHub secrets:
#   CLOUDFLARE_API_TOKEN (Workers Edit + Account Read)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (fejl-alarm — tilføjet 2026-06-07
#   efter 13 dages ubemærket rød CI; botten publicerede uden at noget kom live)
#
# TRUSTED BOUNDARY (hq/decisions/2026-09-26-trusted-boundary.md, samme princip som birkenborg-sites):
# - `build` bygger sitet og chat-korpusset uden nogen hemmelighed. Kun her kører kode, HQ kan skrive (site/src/).
# - `deploy` holder CLOUDFLARE_API_TOKEN og kører ingen kode, HQ kan skrive: et betroet sparse træ (worker/, wrangler.toml,
#   rod-manifesterne), et assert-trin der fejler hvis andet er på disken, install med --ignore-scripts, en pinnet wrangler
#   og byggets artefakter; den deployer med en kopi af wrangler.toml uden [build] (korpusset er bygget i `build`).
# - `alarm` holder alarm-nøglerne og checker intet ud.
# Enhver ændring her kræver en overvåget gen-godkendelse af grænsen (hq/organisation/trusted-boundary.json).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'worker/**'
      - 'content/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  # Node 20-actions deprecates 2026-06-16 — opt-in til Node 24 nu
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install root dependencies (gray-matter til build-corpus.mjs)
        run: npm ci --ignore-scripts
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site (prebuild bygger chat-korpusset)
        working-directory: site
        run: npm run build
      # Byggets identitet: HQ's live-verifikation læser /hq-build.json og binder den til netop denne kørsel på main.
      - name: Build marker
        run: printf '{"sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > site/dist/hq-build.json
      - name: Refuse edge code in dist
        run: |
          if [ -e site/dist/_worker.js ] || [ -e site/dist/_routes.json ] || [ -d site/dist/functions ]; then echo "edge code in dist: refused"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: chat-corpus
          path: worker/data/chat-corpus.json
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # TRUSTED_CHECKOUT — do not widen. Only paths HQ cannot write. Any change needs a supervised re-pin.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /wrangler.toml
            /package.json
            /package-lock.json
            /worker/
      - name: Assert trusted tree
        run: |
          test ! -e site
          test ! -e content
          test ! -e scripts
      # wrangler.toml's [build] (til lokal `wrangler deploy`) kører scripts/, som ikke findes i dette træ: deploy bruger en kopi
      # uden. Korpusset er bygget i `build`.
      - name: Deploy config without the build command
        run: |
          awk '/^\[/{skip=($0=="[build]")} !skip' wrangler.toml > wrangler.deploy.toml
          if grep -q -E '^\[build\]|^command' wrangler.deploy.toml; then echo "deploy config still runs a build command"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist/
      - uses: actions/download-artifact@v4
        with:
          name: chat-corpus
          path: worker/data/
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install worker dependencies (marked)
        run: npm ci --ignore-scripts
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.131.1 deploy --config wrangler.deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Går via den erklærede vej, så alarmen bliver logget og sorteret som
  # "risiko". Nødvejen nedenunder er ikke pynt: fejler denne deploy fordi
  # Cloudflare er nede, kan bot.birkenborg.dev være nede af samme grund, og
  # så skal alarmen stadig frem. En tavs fejlet deploy opdages aldrig.
  alarm:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Telegram-alarm ved fejl
        env:
          BOT_INTERNAL_TOKEN: ${{ secrets.BOT_INTERNAL_TOKEN }}
        run: |
          PAYLOAD='{"text":"birkenborg.dev kunne ikke opdateres — sitet viser stadig den gamle udgave. Sig til, så finder jeg fejlen.","level":"risiko","source":"birkenborg.dev","what":"birkenborg.dev kunne ikke opdateres — sitet viser stadig den gamle udgave, og det du senest har ændret er ikke gået i luften.","action":"Sig til, så finder jeg fejlen og sender det live igen."}'
          if curl -fsS -X POST "https://bot.birkenborg.dev/internal/notify" \
               -H "Authorization: Bearer $BOT_INTERNAL_TOKEN" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" > /dev/null; then
            exit 0
          fi
          echo "Erklæret vej svarede ikke — bruger nødvejen direkte til Telegram."
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="birkenborg.dev kunne ikke opdateres — sitet viser stadig den gamle udgave. Sig til, så finder jeg fejlen." > /dev/null
